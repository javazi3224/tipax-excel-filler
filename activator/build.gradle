plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'ir.tipaxrezashahr.activator'
    compileSdk 34

    defaultConfig {
        applicationId "ir.tipaxrezashahr.activator"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    // همون کلید امضای ثابت اپ اصلی، تا نصب نسخه‌ی جدید روی قبلی همیشه جواب بده
    signingConfigs {
        debug {
            storeFile file("${rootProject.projectDir}/ci_signing_asset.bin")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
}
