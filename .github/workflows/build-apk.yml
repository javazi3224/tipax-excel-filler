name: Build debug APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tipax-excel-filler-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # این مرحله اپ رو به یه ریلیز عمومی و همیشه-ثابت به اسم "latest" آپلود
      # می‌کنه، تا بشه بدون لاگین به گیت‌هاب، مستقیم از گوشی (یا هر جای
      # دیگه) دانلودش کرد. هر بار که این اکشن اجرا بشه، فایل قبلی تو همین
      # ریلیز عوض میشه و لینک دانلود همیشه همون می‌مونه.
      - name: Publish to "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest debug build
          body: "آخرین نسخه‌ی تست اپ تیپاکس. این ریلیز با هر پوش به main به‌روزرسانی میشه."
          files: app/build/outputs/apk/debug/app-debug.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
