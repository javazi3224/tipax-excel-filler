plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'ir.tipaxrezashahr.excelfiller'
    compileSdk 34

    defaultConfig {
        applicationId "ir.tipaxrezashahr.excelfiller"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    // the official Tipax template is ~1.8MB; don't let the build re-compress
    // assets in a way that breaks the xlsx zip
    androidResources {
        noCompress += "xlsx"
    }

    // قبلاً debug.keystore هر بار توسط خود گریدل/CI به‌صورت رندوم ساخته می‌شد،
    // یعنی هر بیلد با یه کلید امضای متفاوت ساخته می‌شد. نتیجه‌ش این بود که
    // نصب نسخه‌ی جدید روی گوشی‌هایی که نسخه‌ی قبلی رو نصب داشتن (مخصوصاً
    // اندروید ۱۴ که پیام خطای نصب رو مبهم‌تر نشون می‌ده) با خطای
    // «امضا با نسخه‌ی نصب‌شده نمی‌خونه» رد می‌شد. با ثابت کردن کلید دیباگ
    // (همین فایل debug.keystore تو ریشه‌ی پروژه) همه‌ی بیلدها همیشه با یه
    // امضای یکسان ساخته می‌شن و آپدیت بدون نیاز به حذف نسخه‌ی قبلی جواب میده.
    signingConfigs {
        debug {
            storeFile file("${rootProject.projectDir}/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
}
